# KSP (Hilt + Room) and the Compose compiler are memory-hungry; the 512 MB default
# causes intermittent OutOfMemory failures during annotation processing.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# Each module gets only its own R class, so resource lookups stay unambiguous
# and incremental builds do not invalidate on unrelated resource changes.
android.nonTransitiveRClass=true

kotlin.code.style=official
