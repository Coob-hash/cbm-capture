name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please search the existing issues first.
        Security vulnerabilities must be reported privately, as described in [SECURITY.md](https://github.com/Coob-hash/cbm-capture/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as a reporter
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Android Settings > Apps > CBM Capture.
      placeholder: 1.0.7
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 15
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Role
      options:
        - Reporter
        - Technician
        - Facility manager
        - Not signed in
    validations:
      required: true

  - type: dropdown
    id: camera
    attributes:
      label: Camera mode
      description: Only for problems with taking photos.
      options:
        - AR camera (ARCore)
        - Standard camera
        - Not applicable

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant `adb logcat` output. Remove tokens, e-mail addresses and server URLs first.
      render: text
