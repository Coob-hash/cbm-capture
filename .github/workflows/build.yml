# Builds and tests both apps.
#
# This file must sit at the ROOT of the git repository to be picked up. If this folder is
# nested inside a larger repo, move .github/ to the repo root and adjust the `working-directory`
# values below.
#
# The iOS job is the reason this workflow exists. Xcode runs only on macOS, so a Windows or
# Linux workstation cannot compile the iOS target at all; GitHub's macOS runners can, at no cost
# for a public repository. Push once and the ARKit, SwiftUI, and SwiftData code is compiled by a
# real Xcode toolchain and its test suite is executed.

name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android — build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cbm-capture-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/testDebugUnitTest

  ios:
    name: iOS — build and test
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # Deliberately NOT pinning an Xcode version. Pinning Xcode_16 selected a toolchain whose
      # bundled iOS 18.0 simulator runtime is not installed on the image, while the simulators
      # that do exist are newer - so every destination was ineligible and the error read as a
      # missing SDK. The image's default Xcode always has matching runtimes, and the project
      # only requires Xcode 16 or later.
      - name: Toolchain and simulator inventory
        run: |
          xcodebuild -version
          echo "--- installed simulator runtimes ---"
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      # Builds against the simulator SDK, which needs no signing certificate. ARKit and
      # RealityKit compile for the simulator even though the AR session cannot run there —
      # which is exactly what is being checked here: that the code is correct, not that the
      # camera works on a machine with no camera.
      # `set -o pipefail` is load-bearing, not boilerplate. GitHub runs steps with `bash -e`,
      # which does NOT set pipefail, so the exit status of `xcodebuild | xcbeautify` is
      # xcbeautify's - and xcbeautify exits 0 even when the build it just formatted failed.
      # Without this line the job reports a green tick over `** BUILD FAILED **`.
      #
      # `generic/platform=iOS Simulator` needs no concrete device, which is the point: naming a
      # specific simulator ("iPhone 16") makes the job depend on the runner image happening to
      # have that device pre-created, and it does not always. Compilation is what this step is
      # for, and it does not need a bootable device.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project CBMCapture.xcodeproj \
            -scheme CBMCapture \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # Tests do need a real device, so resolve one at run time rather than guessing its name.
      - name: Resolve a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime, devices in runtimes.items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable"):
                      print(device["udid"])
                      raise SystemExit
          ')
          if [ -z "$UDID" ]; then
            echo "No available iOS simulator on this runner. Devices seen:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          xcrun simctl list devices | grep "$UDID" || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # `platform=iOS Simulator` alongside the id is required, not decorative: given a bare
      # `id=...` xcodebuild searches every platform, matches nothing, and reports the physical
      # "Any iOS Device" placeholder as the near miss - an error that reads as a missing SDK
      # rather than an under-specified destination.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project CBMCapture.xcodeproj \
            -scheme CBMCapture \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

  server:
    name: Server — migration, workflows, Code nodes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cbm
          POSTGRES_PASSWORD: cbm
          POSTGRES_DB: cbm_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: cbm
      PSQL: psql -v ON_ERROR_STOP=1 -h localhost -U cbm -d cbm_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Applied to the real release-2026_07_13 schema, not a hand-made fixture, so a migration
      # that only works against an imagined table shape fails here.
      - name: Apply base schema and migration
        working-directory: server/sql
        run: |
          $PSQL -q -f 000_base_schema.reference.sql
          $PSQL -q -f 001_add_camera_intrinsics.sql
          echo "--- re-applying to prove idempotency ---"
          $PSQL -q -f 001_add_camera_intrinsics.sql

      - name: Constraint tests
        working-directory: server/sql
        run: $PSQL -f tests/constraints_test.sql

      - name: Staging query test
        working-directory: server/sql
        run: $PSQL -f tests/staging_test.sql

      - name: Workflows are structurally sound
        working-directory: server/n8n
        run: python validate_workflows.py WF1_Capture_Intake.json WF2_EOD_AI_Agent_and_FM_Approval.json

      - name: Code node behaviour
        working-directory: server/n8n
        run: node test_code_nodes.mjs

      # The whole point of this change is that no fabricated calibration can reach the ray math.
      - name: No CAMERA_* environment fallback survives
        run: |
          if grep -rn 'env\.CAMERA_' server/n8n/*.json; then
            echo "::error::a \$env.CAMERA_* fallback is back in the workflows"
            exit 1
          fi
          echo "no \$env.CAMERA_* references in the workflows"

  contract:
    name: Contract — schema and example agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jsonschema pyyaml

      # Cheap, and it catches the failure mode that would be most expensive in the field: an app
      # and a server that disagree about the shape of a capture package.
      - name: Validate the example against the schema
        run: |
          python - <<'PY'
          import json, jsonschema
          schema = json.load(open("contract/capture-metadata.schema.json"))
          example = json.load(open("contract/example-capture.json"))
          jsonschema.validate(example, schema)
          assert example["camera"]["width"] == example["image"]["width"]
          assert example["camera"]["height"] == example["image"]["height"]
          t = example["target"]["pixel"]
          assert 0 <= t["x"] < example["image"]["width"]
          assert 0 <= t["y"] < example["image"]["height"]
          print("contract OK: example validates and the frame invariant holds")
          PY

      - name: Validate the OpenAPI document parses
        run: python -c "import yaml; yaml.safe_load(open('contract/openapi.yaml')); print('openapi.yaml OK')"
