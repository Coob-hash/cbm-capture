# XcodeGen specification.
#
# The repository deliberately contains no .xcodeproj: that file is generated, enormous, and
# merges badly. `xcodegen generate` in this directory produces CBMCapture.xcodeproj from this
# spec, so every machine and the CI runner build an identical project.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open CBMCapture.xcodeproj

name: CBMCapture

options:
  bundleIdPrefix: ai.cbm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 language mode. The concurrency annotations throughout the app (@MainActor on the
    # view models, actors for the store and synchroniser, Sendable on the snapshot types) were
    # written for strict checking, so compiling in Swift 5 mode would silently discard the
    # guarantees they exist to provide.
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  CBMCapture:
    type: application
    platform: iOS
    sources:
      - path: CBMCapture
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.cbm.capture
        # No PRODUCT_NAME override. Setting it to "CBM Capture" builds
        # `CBM Capture.app/CBM Capture`, while the test bundle's TEST_HOST is derived from the
        # target name and looks for `CBMCapture.app/CBMCapture` - so the app builds fine and
        # every test run fails with "Could not find test host". The home-screen name comes from
        # CFBundleDisplayName in Info.plist, which is already "CBM Capture".
        INFOPLIST_FILE: CBMCapture/Resources/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only; the capture UI is portrait-phone
        CODE_SIGN_STYLE: Automatic
        # Left blank so a fresh clone builds for the simulator with no signing setup.
        # Set your team here (or in Xcode) before running on a physical device.
        DEVELOPMENT_TEAM: ""
    dependencies:
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: SwiftData.framework

  CBMCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CBMCaptureTests
    dependencies:
      - target: CBMCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.cbm.capture.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CBMCapture:
    build:
      targets:
        CBMCapture: all
        CBMCaptureTests: [test]
    test:
      commandLineArguments: {}
      targets:
        - CBMCaptureTests
      gatherCoverageData: true
    run:
      config: Debug
